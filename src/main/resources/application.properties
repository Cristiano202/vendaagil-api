spring.application.name=vendaagil-api

# Carrega as variaveis do arquivo .env (raiz do projeto). Opcional: se nao existir, usa as variaveis do ambiente.
spring.config.import=optional:file:.env[.properties]

# ---------- PostgreSQL ----------
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:vendaagil_db}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# ---------- JPA / Hibernate ----------
# O esquema e gerenciado pelo Flyway (db/migration). O Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Exibir SQL no terminal (util em dev; desative em producao)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- Redis ----------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
# Vazio = sem senha (usado so no CI); em dev e producao a senha vem do .env / ambiente
spring.data.redis.password=${REDIS_PASSWORD:}
# Tempo maximo de espera por um comando antes de falhar
spring.data.redis.timeout=2s

# ---------- MongoDB (Spring Boot 4: prefixo spring.mongodb, NAO spring.data.mongodb) ----------
# authSource=admin porque o usuario root do Mongo e criado no banco "admin"
spring.mongodb.uri=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST:localhost}:27017/${MONGO_DB:vendaagil_mongo}?authSource=admin

# ---------- JWT ----------
# Chave secreta vem do .env / ambiente. Nunca escreva o valor aqui.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# URL para onde o back-end enviará o usuário após gerar o JWT
app.oauth2.redirect-uri=${FRONTEND_OAUTH_REDIRECT_URI:http://localhost:5173/oauth/callback}