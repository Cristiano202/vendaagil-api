spring.application.name=vendaagil-api

# Carrega as variaveis do arquivo .env (raiz do projeto). Opcional: se nao existir, usa as variaveis do ambiente.
spring.config.import=optional:file:.env[.properties]

# ---------- Banco de dados (PostgreSQL via Docker) ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:vendaagil_db}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# ---------- JPA / Hibernate ----------
# O esquema e gerenciado pelo Flyway (db/migration). O Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Exibir SQL no terminal (util em dev; desative em producao)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- JWT ----------

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}