name: Java CI com Maven

on:
  push:
    branches:
      - feat/**
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    name: Compilar e Testar API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Dar permissão de execução ao Maven Wrapper
        run: chmod +x ./mvnw

      - name: Compilar e Empacotar (sem testes de contexto de BD)
        run: ./mvnw clean package -DskipTests
